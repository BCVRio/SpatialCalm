# Front end: builds the ZapWorks upload zip as a downloadable artifact and publishes a
# test build to GitHub Pages for UI/billing QA. The production app is the zip on ZapWorks.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['api/**', 'design/**']
  pull_request:
    paths-ignore: ['api/**', 'design/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ZapWorks zip
        run: sh tools/make-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: resonance-webar-zip
          path: dist/*.zip
          if-no-files-found: error

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i
      - run: npx playwright install --with-deps chromium
      - run: (python3 -m http.server 8080 --bind 127.0.0.1 &) && sleep 1 && npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: tools/out/*.png

  pages:
    if: github.event_name != 'pull_request'
    needs: [zip, smoke]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage static test build
        run: mkdir -p site && cp -r index.html fonts assets .nojekyll site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
